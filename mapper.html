<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starchart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06070f; --panel:#0c1020; --line:#26305a; --text:#c6cde3; --dim:#5e6a94;
  --amber:#e9b34e; --cyan:#5ad6d6; --rust:#c9583a; --gm:#8e5cc7;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:18px/1.25 "VT323",monospace}
button,input,select{font:inherit;color:inherit}
button{background:transparent;border:1px solid var(--line);padding:2px 10px;cursor:pointer;text-transform:uppercase;font-family:"Silkscreen",monospace;font-size:9px;letter-spacing:.5px}
button:hover,button.on{background:var(--line)}
button:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
#app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 360px;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{margin:0 12px 0 0;font:11px "Silkscreen",monospace;color:var(--amber);letter-spacing:1px}
#crumbs{display:flex;gap:6px;align-items:center;flex:1;min-width:120px}
#crumbs a{color:var(--cyan);cursor:pointer;text-decoration:none}
#crumbs a:hover{text-decoration:underline}
#crumbs span.sep{color:var(--dim)}
#stage{position:relative;overflow:hidden;background:var(--bg)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;position:absolute;left:0;top:0;cursor:crosshair}
#hint{position:absolute;left:8px;bottom:6px;color:var(--dim);font-size:15px;pointer-events:none}
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:6px;text-align:center;cursor:pointer;font:9px "Silkscreen",monospace;text-transform:uppercase;color:var(--dim);border-right:1px solid var(--line)}
.tab.on{color:var(--amber);background:#11162c}
.pane{display:none;flex:1;min-height:0;overflow:auto;padding:10px 12px}
.pane.on{display:block}
#edit.pane.on{display:flex;flex-direction:column;padding:0}
textarea{flex:1;width:100%;resize:none;border:0;background:#080a16;color:var(--text);padding:10px;font:16px/1.3 "VT323",monospace;tab-size:2}
.editbar{display:flex;gap:6px;padding:6px;border-top:1px solid var(--line);align-items:center;color:var(--dim);font-size:15px}
h2.name{font:13px "Silkscreen",monospace;color:var(--amber);margin:0 0 2px;text-transform:uppercase}
.kind{color:var(--dim);font-size:15px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
table.meta{border-collapse:collapse;width:100%;margin:6px 0 10px}
table.meta td{padding:1px 6px 1px 0;vertical-align:top;border-bottom:1px dotted #1b2140}
table.meta td:first-child{color:var(--cyan);white-space:nowrap;width:1%;text-transform:lowercase}
.desc p{margin:0 0 8px}
.desc a{color:var(--cyan)}
.gm{border-left:3px solid var(--gm);background:#161226;padding:6px 8px;margin:8px 0;color:#d8c8f0}
.gm::before{content:"GM";font:8px "Silkscreen",monospace;color:var(--gm);display:block;margin-bottom:2px}
.gm p{margin:0 0 4px}
h3.sub{font:9px "Silkscreen",monospace;color:var(--dim);text-transform:uppercase;margin:14px 0 4px;border-bottom:1px solid var(--line);padding-bottom:2px}
ul.track{list-style:none;margin:0;padding:0}
ul.track li{padding:2px 0;border-bottom:1px dotted #1b2140}
ul.track .who{color:var(--amber)}
ul.track .what{color:var(--cyan)}
ul.track .where{color:var(--dim);cursor:pointer}
ul.track .where:hover{color:var(--text)}
ul.kids{list-style:none;margin:0;padding:0}
ul.kids li{padding:2px 0;cursor:pointer;display:flex;gap:8px}
ul.kids li:hover{color:var(--cyan)}
ul.kids .t{color:var(--dim);width:64px;flex:none;font-size:14px;text-transform:uppercase}
.sw{display:inline-block;width:10px;height:10px;border:1px solid var(--line);vertical-align:middle;margin-right:4px}
.empty{color:var(--dim)}
#status{color:var(--dim);font-size:15px}
#status.err{color:var(--rust)}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 55vh 1fr}
  header{grid-column:1}
  aside{border-left:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Starchart</h1>
    <div id="crumbs"></div>
    <span id="status"></span>
    <button id="bGM" class="on" title="Show or hide GM notes">GM notes</button>
    <button id="bAnim" title="Animate orbits in system view">Orbits</button>
    <button id="bOpen">Open</button>
    <button id="bSave">Save</button>
    <button id="bExport" title="Save a copy with all GM notes removed">Player copy</button>
    <input type="file" id="file" accept=".md,.txt,.markdown" hidden>
  </header>
  <div id="stage"><canvas id="cv"></canvas><div id="hint"></div></div>
  <aside>
    <div class="tabs">
      <div class="tab on" data-p="info" tabindex="0">Info</div>
      <div class="tab" data-p="track" tabindex="0">Track</div>
      <div class="tab" data-p="edit" tabindex="0">Edit</div>
    </div>
    <div class="pane on" id="info"></div>
    <div class="pane" id="track"></div>
    <div class="pane" id="edit">
      <textarea id="src" spellcheck="false"></textarea>
      <div class="editbar"><span>Edits redraw the map as you type. Click a body on the map to jump to it here.</span></div>
    </div>
  </aside>
</div>

<script id="sample" type="text/markdown">
# Sector: Carcosa Reach
coords: 28, 40

Frontier sector on the far edge of the Company's shipping lanes. Three weeks from anywhere that matters.

> GM: The Reach is where the Company buries things. Every system here has a
> reason nobody talks about it back in the core.

## System: Tannhauser
coords: 30, 55
star: orange
jump: Vega Deep (3), Ferrous Cross (1)

A tired orange star with one habitable world and a lot of rock.

- @Marshal Okonkwo — runs the system from Ferrous Station, tired, honest
- #The Ledger — Halcyon's real shipping manifest, someone on IV has it

### Tannhauser IV
type: planet
orbit: 3
color: rust
pattern: bands
rings: yes
atmosphere: thin, CO2, breathable with filter
gravity: 0.8g
climate: cold desert, dust storms
surface: iron flats, canyon systems
population: 40,000
port: C
factions: Halcyon Mining, Colonial Marshals

The only reason anyone comes to Tannhauser. Halcyon runs open-pit iron
extraction on the northern flats. Everyone else lives in the canyons.

> GM: The canyons were not formed by water. Halcyon's geologists know this
> and were paid to stop asking.

- @Captain Ines Marr — Halcyon site boss, owes the crew a favor
- @The Warden — marshal AI, increasingly erratic
- #Core sample 7 — the thing everyone wants

#### Ferrous Station
type: station
orbit: Tannhauser IV
population: 1,200
port: B
factions: Colonial Marshals

Transfer station in low orbit. Fuel, repairs, a bar that closes at 0200.

##### Hab Block C
type: location

Where the marshals keep people they haven't decided about yet.

#### Tannhauser IV-a
type: moon
orbit: Tannhauser IV
color: bone
pattern: craters

Dead rock. Halcyon's comms relay sits on the far side.

### Tannhauser II
type: planet
orbit: 1
color: ochre
pattern: solid
atmosphere: none
gravity: 0.3g
climate: scorched
surface: glass plains

Too close to the star. Nobody goes here.

### Tannhauser VII
type: planet
orbit: 6
color: slate
pattern: swirl
rings: yes
atmosphere: hydrogen, crushing
gravity: 2.4g
climate: storm giant
population: 0

Gas giant. Halcyon skims fuel from the upper atmosphere with drone tankers.

> GM: One of the drone tankers went silent eleven days ago. Its last telemetry
> showed it descending, not ascending.

### Belt Kessler
type: belt
orbit: 4

Thin asteroid belt. Salvage claims, mostly abandoned.

## System: Ferrous Cross
coords: 62, 38
star: red
jump: Tannhauser (1), Vega Deep (2)

Red dwarf with a single tidally locked world.

### Anvil
type: planet
orbit: 2
color: blood
pattern: spots
atmosphere: thick, toxic
gravity: 1.1g
climate: one side burns, one side freezes
surface: twilight band settlements
population: 8,000
port: D
factions: Independent Miners Union

Settlers live in the terminator band and don't trust Company ships.

- @Aunt Vesh — union boss, sells information, never for money

## System: Vega Deep
coords: 45, 15
star: blue
jump: Tannhauser (3), Ferrous Cross (2)

Blue-white giant. Radiation hazard beyond orbit 5. Research outpost only.

### Deep Station
type: station
orbit: 7
population: 60
port: X
factions: Company Science Division

> GM: Deep Station is studying the thing that carved the Tannhauser canyons.
> They think it's dormant. It isn't.

# Sector: Halcyon Verge
coords: 62, 58

Company core-ward sector. Well patrolled, expensive, dull.

## System: Meridian
coords: 50, 50
star: yellow
jump: Cassian (2)

Company regional hub.

### Meridian Prime
type: planet
orbit: 3
color: jade
pattern: ocean
atmosphere: standard
gravity: 1.0g
climate: temperate
surface: oceans, archipelagos
population: 12,000,000
port: A
factions: The Company

### Meridian Prime Highport
type: station
orbit: Meridian Prime
port: A

## System: Cassian
coords: 22, 70
star: white
jump: Meridian (2)

### Cassian III
type: planet
orbit: 2
color: ice
pattern: icecaps
atmosphere: thin
gravity: 0.7g
climate: arctic
population: 300,000
port: B
factions: The Company, Cassian Free Council
</script>

<script>
/* ---------- palette ---------- */
const PAL = {
  rust:['#5a1c10','#b8472a','#e8875a'], ochre:['#5c3d10','#b88328','#ecc768'],
  sand:['#6b5a3a','#c8b07a','#f0e2b6'],  jade:['#0f3d2e','#2f8a5c','#8ad9a0'],
  teal:['#0c3a44','#2b8a94','#7fd6d6'],  ice:['#3a4f7a','#8ab0d8','#e6f2ff'],
  violet:['#2a1444','#6b3fa0','#b98ae0'],slate:['#1e2334','#4c5674','#9aa4c2'],
  blood:['#3a0a0a','#8f1f1f','#d45c4c'], bone:['#3c3a34','#8f8a7c','#dcd6c4'],
  amber:['#5a3a06','#c8861a','#f6c85a'], cyan:['#0a3a44','#1f9aa8','#7cf0f0'],
  moss:['#1d2a10','#4f7024','#a4c95c'],  grey:['#2a2a2e','#6a6a72','#b4b4bc']
};
const PALNAMES = Object.keys(PAL);
const STAR = { orange:'#f2a23c', red:'#e0553a', yellow:'#f6e07a', white:'#f2f4ff', blue:'#8fbaff' };
const PATTERNS = ['bands','spots','swirl','craters','icecaps','ocean','solid'];

/* ---------- seeded helpers ---------- */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function vnoise(seed){
  const lat=(x,y)=>{const h=hash(seed+':'+x+':'+y);return (h&0xffff)/0xffff};
  const sm=t=>t*t*(3-2*t);
  return (x,y)=>{const x0=Math.floor(x),y0=Math.floor(y),fx=sm(x-x0),fy=sm(y-y0);
    const a=lat(x0,y0),b=lat(x0+1,y0),c=lat(x0,y0+1),d=lat(x0+1,y0+1);
    return (a*(1-fx)+b*fx)*(1-fy)+(c*(1-fx)+d*fx)*fy};
}
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];

/* ---------- parser ---------- */
function parse(text){
  const root={depth:0,type:'galaxy',name:'Galaxy',meta:{},desc:[],gm:[],people:[],objects:[],children:[],line:0};
  const stack=[root]; let cur=null, mode='none', gmbuf=null;
  const lines=text.split(/\r?\n/);
  const flushGM=()=>{if(gmbuf){cur.gm.push(gmbuf.join('\n'));gmbuf=null}};
  lines.forEach((raw,i)=>{
    const h=raw.match(/^(#{1,6})\s+(.*)$/);
    if(h){
      if(cur)flushGM();
      const depth=h[1].length; let name=h[2].trim();
      let type=null;
      const pre=name.match(/^(sector|system|planet|moon|station|belt|location|body|derelict|asteroid)\s*:\s*(.*)$/i);
      if(pre){type=pre[1].toLowerCase();name=pre[2].trim()}
      const node={depth,type,name,meta:{},desc:[],gm:[],people:[],objects:[],children:[],line:i};
      while(stack.length>1&&stack[stack.length-1].depth>=depth)stack.pop();
      node.parent=stack[stack.length-1]; node.parent.children.push(node); stack.push(node);
      cur=node; mode='meta'; return;
    }
    if(!cur)return;
    const t=raw.trim();
    if(mode==='meta'){
      const m=t.match(/^([\w-]+)\s*:\s*(.*)$/);
      if(m){cur.meta[m[1].toLowerCase()]=m[2].trim();return}
      mode='body';
    }
    if(t.startsWith('>')){
      let s=t.replace(/^>\s?/,'');
      if(!gmbuf){gmbuf=[];s=s.replace(/^GM\s*:\s*/i,'')}
      gmbuf.push(s); return;
    }
    flushGM();
    const tr=t.match(/^[-*]\s*([@#])\s*(.+?)(?:\s+(?:—|–|-|:)\s+(.*))?$/);
    if(tr){(tr[1]==='@'?cur.people:cur.objects).push({name:tr[2].trim(),note:tr[3]||''});return}
    cur.desc.push(raw);
  });
  if(cur)flushGM();
  // resolve types and computed fields
  const walk=n=>{
    if(n.depth===1)n.type=n.type||'sector';
    else if(n.depth===2)n.type=n.type||'system';
    else if(n.depth>=3)n.type=(n.meta.type||n.type||(n.depth===3?'planet':n.depth>=5?'location':'moon')).toLowerCase();
    n.id=(n.parent&&n.parent.depth>0?n.parent.id+'/':'')+n.name;
    if(n.meta.coords){const c=n.meta.coords.split(/[, ]+/).map(Number);n.x=c[0];n.y=c[1]}
    n.orbit=n.meta.orbit!==undefined?(isNaN(+n.meta.orbit)?n.meta.orbit:+n.meta.orbit):null;
    n.children.forEach(walk);
  };
  root.children.forEach(walk);
  return root;
}
function findByName(nodes,name){name=name.toLowerCase();return nodes.find(n=>n.name.toLowerCase()===name)}
function descendants(n,acc=[]){n.children.forEach(c=>{acc.push(c);descendants(c,acc)});return acc}
function findId(root,id){if(root.id===id)return root;for(const c of root.children){const r=findId(c,id);if(r)return r}return null}

/* ---------- state ---------- */
let TEXT='', ROOT=null, VIEW={level:'galaxy',node:null}, SEL=null, HOVER=null, SHOWGM=true, ITEMS=[], S=2, W=400, H=250;
let ANIM=!matchMedia('(prefers-reduced-motion: reduce)').matches, RAF=null;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const stage=document.getElementById('stage'), src=document.getElementById('src'), status=document.getElementById('status');

function load(text){
  TEXT=text; src.value=text; ROOT=parse(text);
  if(VIEW.node){const n=findId(ROOT,VIEW.node.id);VIEW.node=n||null;if(!n)VIEW.level='galaxy'}
  if(SEL){SEL=findId(ROOT,SEL.id)}
  resize(); renderCrumbs(); renderPanel(); renderTrack(); kickAnim();
}

/* ---------- drawing primitives ---------- */
function px(x,y,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),1,1)}
function dith(x,y,v,cols){ // v 0..1 across cols with ordered dither
  const n=cols.length-1; const f=v*n; let i=Math.floor(f); const fr=f-i;
  if(i>=n)i=n-1;const th=(BAYER[(y&3)][(x&3)]+.5)/16; return cols[Math.min(n,i+(fr>th?1:0))];
}
function text(x,y,s,c,align='left',size=8){ctx.font=size+'px Silkscreen, monospace';ctx.textAlign=align;ctx.textBaseline='top';ctx.fillStyle=c;ctx.fillText(s,Math.round(x),Math.round(y))}
function starfield(seed,density=0.004){
  const r=rng(seed);const n=W*H*density;
  for(let i=0;i<n;i++){const v=r();px(r()*W,r()*H,v>.9?'#8892b8':v>.6?'#3a4470':'#1e2444')}
}
function drawPlanet(cx,cy,r,node){
  const seed=hash(node.name), R=rng(seed), noise=vnoise(node.name);
  const pname=PAL[node.meta.color]?node.meta.color:PALNAMES[seed%PALNAMES.length];
  const cols=PAL[pname];
  const pat=PATTERNS.includes(node.meta.pattern)?node.meta.pattern:(node.type==='moon'?'craters':PATTERNS[(seed>>>8)%6]);
  const rings=/^(y|yes|true|1)/i.test(node.meta.rings||'');
  const freq=2+R()*3, ph=R()*6.28, tilt=(R()-.5)*.6;
  const craters=[];for(let i=0;i<4+R()*6;i++)craters.push([(R()*2-1)*.8,(R()*2-1)*.8,.08+R()*.22]);
  const ringCols=[cols[0],cols[1],cols[2]];
  const ringPass=front=>{
    if(!rings)return;
    for(let a=0;a<628;a++){const t=a/100;
      const x=Math.cos(t)*r*1.75, y=Math.sin(t)*r*.28+x*tilt*.3;
      if(front?y<0:y>=0)continue;
      if(x*x/(r*r)+y*y/(r*r)<1&&front)continue;
      const band=Math.floor((Math.abs(Math.sin(t*1.1))*3))%3;
      if(((a*7)&5)===0)continue;
      px(cx+x,cy+y,ringCols[band]);}
  };
  ringPass(false);
  const rr=r+.5;
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){
    if(x*x+y*y>rr*rr)continue;
    const nx=x/r, ny=y/r, nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
    let v=.5;
    switch(pat){
      case 'bands': v=.5+.45*Math.sin(ny*freq*2+ph+noise(nx*2,ny*3)*1.2);break;
      case 'spots': v=noise(nx*3+10,ny*3+10)>.55?.9:.3;break;
      case 'swirl': v=.5+.45*Math.sin(ny*freq*1.5+nx*2+noise(nx*3,ny*3)*3+ph);break;
      case 'craters': v=.55;for(const c of craters){const d=Math.hypot(nx-c[0],ny-c[1]);if(d<c[2])v=d<c[2]*.7?.15:.9}break;
      case 'icecaps': v=Math.abs(ny)+noise(nx*4,ny*4)*.25>.75?1:noise(nx*2,ny*2)*.6+.1;break;
      case 'ocean': v=noise(nx*2.2+3,ny*2.2+3)>.52?.85:.2;break;
      case 'solid': v=.5+noise(nx*5,ny*5)*.15;break;
    }
    const light=(-nx*.55-ny*.45+nz*.7);
    v=v*.55+light*.55; v=Math.max(0,Math.min(1,v));
    px(cx+x,cy+y,dith(cx+x,cy+y,v,cols));
  }
  ringPass(true);
  node._cols=cols;
}
function drawStar(cx,cy,r,color){
  const rr=r+.5;
  for(let y=-r-3;y<=r+3;y++)for(let x=-r-3;x<=r+3;x++){
    const d=Math.hypot(x,y);
    if(d<=rr){px(cx+x,cy+y,d<r*.55?'#ffffff':color)}
    else if(d<rr+3){if(BAYER[(cx+x)&3][(cy+y)&3]<(rr+3-d)*5)px(cx+x,cy+y,color)}
  }
}
function drawRoute(x1,y1,x2,y2,c){
  const dx=x2-x1,dy=y2-y1,n=Math.max(Math.abs(dx),Math.abs(dy));
  for(let i=0;i<=n;i+=3)px(x1+dx*i/n,y1+dy*i/n,c);
}
function box(x,y,w,h,c){ctx.strokeStyle=c;ctx.lineWidth=1;ctx.strokeRect(Math.round(x)+.5,Math.round(y)+.5,w,h)}

/* ---------- views ---------- */
function resize(){
  const cw=stage.clientWidth, ch=stage.clientHeight;
  S=Math.max(2,Math.floor(cw/420)); W=Math.floor(cw/S); H=Math.floor(ch/S);
  cv.width=W;cv.height=H;cv.style.width=W*S+'px';cv.style.height=H*S+'px';
  draw();
}
function draw(){
  if(!ROOT)return;
  ITEMS=[]; ctx.fillStyle='#06070f'; ctx.fillRect(0,0,W,H);
  ({galaxy:drawGalaxy,sector:drawSector,system:drawSystem})[VIEW.level]();
}
function tick(){RAF=null;if(ANIM&&VIEW.level==='system'){draw();RAF=requestAnimationFrame(tick)}}
function kickAnim(){if(!RAF&&ANIM&&VIEW.level==='system')RAF=requestAnimationFrame(tick)}
function mapXY(n,pad){return[pad+(n.x??50)/100*(W-pad*2),pad+(n.y??50)/100*(H-pad*2)]}
function drawGalaxy(){
  starfield(hash('galaxy'),.006);
  const pad=30;
  text(W/2,4,'GALAXY',"#5e6a94",'center');
  ROOT.children.forEach(sec=>{
    const [x,y]=mapXY(sec,pad);
    const hot=HOVER===sec||SEL===sec;
    sec.children.forEach(sys=>{const sx=x+((sys.x??50)-50)/100*36, sy=y+((sys.y??50)-50)/100*36;
      px(sx,sy,STAR[sys.meta.star]||'#e0e4ff');px(sx+1,sy,'#40486a')});
    box(x-20,y-20,40,40,hot?'#e9b34e':'#26305a');
    text(x,y+24,sec.name.toUpperCase(),hot?'#e9b34e':'#8892b8','center');
    ITEMS.push({x,y,r:22,node:sec});
  });
  if(!ROOT.children.length)text(W/2,H/2,'NO SECTORS. OPEN A FILE OR EDIT.',"#5e6a94",'center');
}
function drawSector(){
  const sec=VIEW.node; starfield(hash(sec.name),.005);
  const pad=34; const pos={};
  sec.children.forEach(s=>{pos[s.name.toLowerCase()]=mapXY(s,pad)});
  sec.children.forEach(s=>{
    const j=(s.meta.jump||'').split(',').map(t=>t.trim()).filter(Boolean);
    j.forEach(t=>{const m=t.match(/^(.*?)\s*(?:\((\d+(?:\.\d+)?)\))?$/);const o=pos[m[1].toLowerCase()];if(!o)return;
      const [x1,y1]=pos[s.name.toLowerCase()],[x2,y2]=o;drawRoute(x1,y1,x2,y2,'#2a3560');
      if(m[2]&&s.name.toLowerCase()<m[1].toLowerCase())text((x1+x2)/2,(y1+y2)/2-4,m[2],'#5e6a94','center');});
  });
  sec.children.forEach(s=>{
    const [x,y]=pos[s.name.toLowerCase()]; const hot=HOVER===s||SEL===s;
    drawStar(x,y,3,STAR[s.meta.star]||'#e0e4ff');
    const nb=s.children.filter(c=>c.type==='planet').length;
    for(let i=0;i<nb;i++)px(x-nb+i*2+1,y+8,'#8892b8');
    text(x,y+11,s.name.toUpperCase(),hot?'#e9b34e':'#c6cde3','center');
    if(hot)box(x-9,y-9,18,18,'#e9b34e');
    ITEMS.push({x,y,r:11,node:s});
  });
  text(W/2,4,sec.name.toUpperCase(),'#5e6a94','center');
}
function drawSystem(){
  const sys=VIEW.node, AT=ANIM?performance.now()/1000:0; starfield(hash(sys.name),.003);
  const cx=Math.round(W*.5), cy=Math.round(H*.5);
  const bodies=sys.children.filter(c=>typeof c.orbit==='number');
  const maxO=Math.max(1,...bodies.map(b=>b.orbit));
  const gap=Math.min(H,W)*.46/(maxO+.5);
  const sr=Math.max(5,Math.round(gap*.35));
  for(const b of bodies){const ro=sr+b.orbit*gap;
    for(let a=0;a<720;a++){const t=a/720*6.2832;if((a&3)!==0)continue;px(cx+Math.cos(t)*ro,cy+Math.sin(t)*ro*.999,'#1c2242')}}
  drawStar(cx,cy,sr,STAR[sys.meta.star]||'#e0e4ff');
  ITEMS.push({x:cx,y:cy,r:sr+2,node:sys});
  bodies.forEach(b=>{
    const ro=sr+b.orbit*gap, ang=(hash(b.name)%360)/180*Math.PI+AT*6.2832/(90*Math.pow(b.orbit,1.4));
    const x=Math.round(cx+Math.cos(ang)*ro), y=Math.round(cy+Math.sin(ang)*ro);
    const hot=HOVER===b||SEL===b;
    if(b.type==='belt'){const R=rng(hash(b.name));for(let i=0;i<160;i++){const t=R()*6.2832,d=ro+(R()-.5)*gap*.35;px(cx+Math.cos(t)*d,cy+Math.sin(t)*d,R()>.5?'#6a6a72':'#3a3a44')}
      text(x,y-10,b.name.toUpperCase(),hot?'#e9b34e':'#5e6a94','center');ITEMS.push({x,y,r:8,node:b});return}
    if(b.type==='station'){box(x-3,y-3,6,6,hot?'#e9b34e':'#5ad6d6');px(x,y,'#5ad6d6');
      text(x,y+7,b.name.toUpperCase(),hot?'#e9b34e':'#c6cde3','center');ITEMS.push({x,y,r:7,node:b});return}
    const size=b.meta.size?+b.meta.size:null;
    const r=Math.max(4,Math.round(size||(b.type==='planet'?(4+(hash(b.name+'r')%5)):3)));
    drawPlanet(x,y,r,b);
    // satellites
    const sats=sys.children.concat(b.children).filter(c=>typeof c.orbit==='string'&&c.orbit.toLowerCase()===b.name.toLowerCase()&&c!==b);
    sats.forEach((s,i)=>{const sa=ang+1.2+i*1.1+AT*.1, sd=r+6+i*3, sx=Math.round(x+Math.cos(sa)*sd), sy=Math.round(y+Math.sin(sa)*sd);
      const shot=HOVER===s||SEL===s;
      if(s.type==='station'){box(sx-1,sy-1,3,3,shot?'#e9b34e':'#5ad6d6')}else{drawPlanet(sx,sy,2,s)}
      if(shot)text(sx,sy+5,s.name.toUpperCase(),'#e9b34e','center');
      ITEMS.push({x:sx,y:sy,r:4,node:s});});
    if(hot)box(x-r-3,y-r-3,r*2+6,r*2+6,'#e9b34e');
    text(x,y+r+4,b.name.toUpperCase(),hot?'#e9b34e':'#c6cde3','center');
    ITEMS.push({x,y,r:r+3,node:b});
  });
  text(W/2,4,sys.name.toUpperCase(),'#5e6a94','center');
}

/* ---------- navigation ---------- */
function goto(node){
  if(!node||node.depth===0){VIEW={level:'galaxy',node:null}}
  else if(node.type==='sector'){VIEW={level:'sector',node}}
  else if(node.type==='system'){VIEW={level:'system',node}}
  else {let p=node;while(p&&p.type!=='system')p=p.parent;if(p)VIEW={level:'system',node:p}}
  SEL=node&&node.depth>0?node:null; draw(); renderCrumbs(); renderPanel(); showPane('info'); kickAnim();
}
function select(node){SEL=node;draw();renderPanel();scrollEditorTo(node)}
function renderCrumbs(){
  const c=document.getElementById('crumbs'); c.innerHTML='';
  const chain=[];let n=VIEW.node;while(n&&n.depth>0){chain.unshift(n);n=n.parent}
  const add=(label,node)=>{const a=document.createElement('a');a.textContent=label;a.onclick=()=>goto(node);c.appendChild(a)};
  add('Galaxy',null);
  chain.forEach(n=>{const s=document.createElement('span');s.className='sep';s.textContent='/';c.appendChild(s);add(n.name,n)});
}
function hit(ev){const r=cv.getBoundingClientRect();const x=(ev.clientX-r.left)/S,y=(ev.clientY-r.top)/S;
  let best=null,bd=1e9;for(const it of ITEMS){const d=Math.hypot(it.x-x,it.y-y);if(d<=it.r&&d<bd){bd=d;best=it.node}}return best}
cv.addEventListener('mousemove',e=>{const h=hit(e);if(h!==HOVER){HOVER=h;draw();cv.style.cursor=h?'pointer':'crosshair';document.getElementById('hint').textContent=h?h.name+(h.meta.port?'  ·  port '+h.meta.port:''):''}});
cv.addEventListener('mouseleave',()=>{HOVER=null;draw()});
cv.addEventListener('click',e=>{const h=hit(e);if(!h)return;
  if(h.type==='sector'||h.type==='system'){if(SEL===h)goto(h);else select(h)} else select(h)});
cv.addEventListener('dblclick',e=>{const h=hit(e);if(h&&(h.type==='sector'||h.type==='system'))goto(h)});
cv.addEventListener('contextmenu',e=>{e.preventDefault();up()});
function up(){if(VIEW.level==='system')goto(VIEW.node.parent);else if(VIEW.level==='sector')goto(null)}
document.addEventListener('keydown',e=>{if(e.target===src)return;if(e.key==='Escape'||e.key==='Backspace')up()});
window.addEventListener('resize',resize);

/* ---------- panel ---------- */
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function md(lines){ // tiny inline markdown -> paragraphs
  const paras=lines.join('\n').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  return paras.map(p=>'<p>'+esc(p).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')
    .replace(/\[(.+?)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\n/g,' ')+'</p>').join('');
}
const HIDDEN=new Set(['coords','type','orbit','color','pattern','rings','jump','star','size']);
function renderPanel(){
  const p=document.getElementById('info');
  const n=SEL||VIEW.node;
  if(!n){p.innerHTML='<h2 class="name">Galaxy</h2><div class="kind">'+ROOT.children.length+' sectors</div>'+kids(ROOT);return}
  let h='<h2 class="name">'+esc(n.name)+'</h2><div class="kind">'+esc(n.type)+(n.parent&&n.parent.depth>0?' · '+esc(n.parent.name):'')+'</div>';
  const rows=[];
  if(n.meta.star)rows.push(['star',n.meta.star]);
  if(n.meta.jump)rows.push(['jumps',n.meta.jump]);
  if(n.type==='planet'||n.type==='moon'){const c=n._cols||PAL[n.meta.color]||PAL[PALNAMES[hash(n.name)%PALNAMES.length]];
    rows.push(['look','<span class="sw" style="background:'+c[1]+'"></span>'+esc(n.meta.pattern||'')+(/^(y|yes|true|1)/i.test(n.meta.rings||'')?' · rings':'')])}
  for(const k in n.meta)if(!HIDDEN.has(k))rows.push([k,esc(n.meta[k])]);
  if(rows.length)h+='<table class="meta">'+rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</table>';
  h+='<div class="desc">'+md(n.desc)+'</div>';
  if(SHOWGM)n.gm.forEach(g=>{h+='<div class="gm">'+md(g.split('\n'))+'</div>'});
  if(n.people.length||n.objects.length){h+='<h3 class="sub">Here</h3><ul class="track">'+
    n.people.map(x=>'<li><span class="who">'+esc(x.name)+'</span> '+esc(x.note)+'</li>').join('')+
    n.objects.map(x=>'<li><span class="what">'+esc(x.name)+'</span> '+esc(x.note)+'</li>').join('')+'</ul>'}
  if(n.type==='sector'||n.type==='system'){
    const ds=descendants(n).filter(d=>d.people.length||d.objects.length);
    if(ds.length){h+='<h3 class="sub">Tracked in '+esc(n.name)+'</h3><ul class="track">';
      ds.forEach(d=>{d.people.forEach(x=>h+='<li><span class="who">'+esc(x.name)+'</span> <span class="where" data-id="'+esc(d.id)+'">@ '+esc(d.name)+'</span></li>');
        d.objects.forEach(x=>h+='<li><span class="what">'+esc(x.name)+'</span> <span class="where" data-id="'+esc(d.id)+'">@ '+esc(d.name)+'</span></li>')});
      h+='</ul>'}
  }
  if(n.children.length)h+='<h3 class="sub">Contains</h3>'+kids(n);
  p.innerHTML=h; wireWhere(p);
}
function kids(n){return '<ul class="kids">'+n.children.map(c=>'<li data-id="'+esc(c.id)+'"><span class="t">'+esc(c.type)+'</span>'+esc(c.name)+'</li>').join('')+'</ul>'}
function wireWhere(el){
  el.querySelectorAll('[data-id]').forEach(li=>li.onclick=()=>{const n=findId(ROOT,li.dataset.id);if(!n)return;
    if(n.type==='sector'||n.type==='system')goto(n);else{let p=n;while(p&&p.type!=='system')p=p.parent;if(p&&VIEW.node!==p){VIEW={level:'system',node:p}}select(n)}});
}
function renderTrack(){
  const p=document.getElementById('track'); const all=descendants(ROOT);
  let h='<h3 class="sub">People</h3><ul class="track">';
  all.forEach(d=>d.people.forEach(x=>h+='<li><span class="who">'+esc(x.name)+'</span> '+esc(x.note)+'<br><span class="where" data-id="'+esc(d.id)+'">@ '+esc(d.name)+'</span></li>'));
  h+='</ul><h3 class="sub">Things</h3><ul class="track">';
  all.forEach(d=>d.objects.forEach(x=>h+='<li><span class="what">'+esc(x.name)+'</span> '+esc(x.note)+'<br><span class="where" data-id="'+esc(d.id)+'">@ '+esc(d.name)+'</span></li>'));
  h+='</ul><p class="empty">Add a line like <b>- @Name — note</b> or <b>- #Thing — note</b> under any heading.</p>';
  p.innerHTML=h; wireWhere(p);
}
function showPane(id){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.p===id));document.querySelectorAll('.pane').forEach(t=>t.classList.toggle('on',t.id===id))}
document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>showPane(t.dataset.p);t.onkeydown=e=>{if(e.key==='Enter')showPane(t.dataset.p)}});
function scrollEditorTo(node){
  if(!document.getElementById('edit').classList.contains('on')||!node)return;
  const lines=src.value.split('\n');let pos=0;for(let i=0;i<node.line;i++)pos+=lines[i].length+1;
  src.focus();src.setSelectionRange(pos,pos+lines[node.line].length);
  const lh=src.scrollHeight/lines.length;src.scrollTop=Math.max(0,node.line*lh-40);
}

/* ---------- editor / files ---------- */
let tmr=null;
src.addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(()=>{load(src.value);setStatus('unsaved edits')},250)});
function setStatus(s,err){status.textContent=s;status.className=err?'err':''}
document.getElementById('bGM').onclick=e=>{SHOWGM=!SHOWGM;e.target.classList.toggle('on',SHOWGM);renderPanel()};
const bAnim=document.getElementById('bAnim');bAnim.classList.toggle('on',ANIM);
bAnim.onclick=()=>{ANIM=!ANIM;bAnim.classList.toggle('on',ANIM);draw();kickAnim()};
document.getElementById('bOpen').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{load(t);setStatus(f.name)})};
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('bSave').onclick=()=>{download('starchart.md',src.value);setStatus('saved')};
document.getElementById('bExport').onclick=()=>{
  const out=src.value.split(/\r?\n/).filter(l=>!/^\s*>/.test(l)).join('\n').replace(/\n{3,}/g,'\n\n');
  download('starchart-players.md',out);setStatus('player copy saved');
};

/* ---------- boot ---------- */
const q=new URLSearchParams(location.search);
if(q.get('src')){
  setStatus('loading…');
  fetch(q.get('src')).then(r=>{if(!r.ok)throw new Error(r.status+' '+r.statusText);return r.text()})
    .then(t=>{load(t);setStatus(q.get('src').split('/').pop())})
    .catch(e=>{load(document.getElementById('sample').textContent.trim());setStatus('could not load '+q.get('src')+' ('+e.message+') — showing sample',true)});
}else load(document.getElementById('sample').textContent.trim());
if(q.get('gm')==='0'){SHOWGM=false;document.getElementById('bGM').classList.remove('on');renderPanel()}
document.fonts&&document.fonts.ready.then(draw);
</script>
